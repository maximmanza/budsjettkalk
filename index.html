<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budsjettkalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Budsjettkalkulator</h1>
        <p>Legg til inntekter og utgifter for måneden.</p>

        <section>
            <h2>Legg til</h2>

            <label for="type">Type:</label>
            <select id="type">
                <option value="inntekt">Inntekt</option>
                <option value="utgift">Utgift</option>
            </select>

            <label for="kategori">Kategori:</label>
            <input type="text" id="kategori" placeholder="For eksempel mat eller lønn">

            <label for="belop">Beløp:</label>
            <input type="number" id="belop" placeholder="Skriv beløp">

            <button id="leggTil">Legg til</button>
        </section>

        <section>
            <h2>Inntekter</h2>
            <ul id="inntekter"></ul>
        </section>

        <section>
            <h2>Utgifter</h2>
            <ul id="utgifter"></ul>
        </section>

        <section class="resultat">
            <h2>Månedlig saldo</h2>
            <p id="saldo">0 kr</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
